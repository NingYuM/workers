name: Verify xdoc release artifacts

on:
  workflow_call:
    inputs:
      run_id:
        description: Workflow run that produced the release artifacts; defaults to the caller run
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run that produced the release artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify xdoc (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: tar.gz
          - os: macos-latest
            target: macos-arm64
            ext: tar.gz
          - os: windows-latest
            target: windows-x64
            ext: zip

    steps:
      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '*'

      - name: Setup MSVC dependency tools
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download packaged xdoc artifact
        uses: actions/download-artifact@v8
        with:
          name: xdoc-${{ matrix.target }}.${{ matrix.ext }}
          path: ${{ runner.temp }}/release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download release verifier
        uses: actions/download-artifact@v8
        with:
          name: release-verifier
          path: ${{ runner.temp }}/release-verifier
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify packaged CLI
        shell: nu {0}
        env:
          ARCHIVE_EXT: ${{ matrix.ext }}
          ARCHIVE_NAME: xdoc-${{ matrix.target }}.${{ matrix.ext }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          RELEASE_INSTALL_DIR: ${{ runner.temp }}/release-install
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERIFIER_DIR: ${{ runner.temp }}/release-verifier
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          let archive = (
            $env.RELEASE_ARTIFACT_DIR
            | path join $env.ARCHIVE_NAME
            | path expand --strict
          )
          mkdir $env.RELEASE_INSTALL_DIR
          let extract_result = if $env.ARCHIVE_EXT == 'zip' {
            run-external '7z' 'x' $archive $'-o($env.RELEASE_INSTALL_DIR)' '-y' | complete
          } else {
            run-external 'tar' '-xzf' $archive '-C' $env.RELEASE_INSTALL_DIR | complete
          }
          if $extract_result.exit_code != 0 {
            error make {
              msg: $'Failed to extract release archive: ($env.ARCHIVE_NAME)'
              help: ($extract_result.stderr | str trim)
            }
          }

          let binary_name = if $nu.os-info.name == 'windows' { 'xdoc.exe' } else { 'xdoc' }
          let binary = (
            $env.RELEASE_INSTALL_DIR
            | path join $binary_name
            | path expand --strict
          )
          let verifier = (
            $env.RELEASE_VERIFIER_DIR
            | path join 'tools' 'verify-xdoc-static.nu'
            | path expand --strict
          )
          let fixture = (
            $env.RELEASE_VERIFIER_DIR
            | path join 'test-fixtures' 'agent-pptx' 'inspect-smoke.pptx'
            | path expand --strict
          )
          let source_identity = (
            $env.RELEASE_VERIFIER_DIR
            | path join 'release-source-identity.json'
            | path expand --strict
          )
          mkdir $env.RELEASE_EVIDENCE_DIR
          let report = ($env.RELEASE_EVIDENCE_DIR | path join 'verification.json')
          let verify_result = (
            run-external 'nu'
              $verifier
              $binary
              $fixture
              '--archive'
              $archive
              '--target'
              $env.RELEASE_TARGET
              '--report'
              $report
              '--source-identity'
              $source_identity
              '--workflow-repository'
              $env.WORKFLOW_REPOSITORY
              '--workflow-ref'
              $env.WORKFLOW_REF
              '--workflow-sha'
              $env.WORKFLOW_SHA
            | complete
          )
          if ($verify_result.stdout | str trim) != '' {
            print ($verify_result.stdout | str trim)
          }
          if $verify_result.exit_code != 0 {
            error make {
              msg: $'Release artifact verification failed: ($env.RELEASE_TARGET)'
              help: ($verify_result.stderr | str trim)
            }
          }

      - name: Upload verification evidence
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ matrix.target }}
          path: ${{ runner.temp }}/release-evidence/verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification summary
        shell: nu {0}
        env:
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          EVIDENCE_PATH: ${{ runner.temp }}/release-evidence/verification.json
        run: |
          let evidence_path = ($env.EVIDENCE_PATH | path expand --strict)
          let evidence = (open $evidence_path)
          if ($evidence.schemaVersion? | default '') != 'xdoc-static-release-verification/v2' {
            error make {msg: 'Unexpected release verification evidence schema'}
          }

          let target = ($evidence.target? | default 'unknown' | into string)
          let status = ($evidence.status? | default 'unknown' | into string)
          let platform = ($evidence.platform? | default {})
          let platform_os = ($platform.os? | default 'unknown' | into string)
          let platform_arch = ($platform.arch? | default 'unknown' | into string)
          let source = ($evidence.source? | default {})
          let source_repository = ($source.repository? | default 'unknown' | into string)
          let source_ref = ($source.ref? | default 'unknown' | into string)
          let source_sha = ($source.sha? | default 'unknown' | into string)
          let source_version = ($source.version? | default 'unknown' | into string)
          let workflow = ($evidence.workflow? | default {})
          let workflow_repository = ($workflow.repository? | default 'unknown' | into string)
          let workflow_ref = ($workflow.ref? | default 'unknown' | into string)
          let workflow_sha = ($workflow.sha? | default 'unknown' | into string)
          let archive = ($evidence.archive? | default {})
          let archive_name = ($archive.name? | default 'unknown' | into string)
          let archive_size = ($archive.sizeBytes? | default 0 | into int)
          let archive_sha = ($archive.sha256? | default 'unknown' | into string)
          let binary = ($evidence.binary? | default {})
          let binary_name = ($binary.name? | default 'unknown' | into string)
          let binary_size = ($binary.sizeBytes? | default 0 | into int)
          let binary_sha = ($binary.sha256? | default 'unknown' | into string)
          let binary_version = ($binary.version? | default 'unknown' | into string)
          let binary_revision = ($binary.revision? | default 'unknown' | into string)
          let agent_schema = ($evidence.agentSchemaVersion? | default 'unknown' | into string)
          let inspect_schema = ($evidence.pptxInspectSchemaVersion? | default 'unknown' | into string)
          let slide_count = ($evidence.slideCount? | default 0 | into int)
          let pdfium = ($evidence.pdfium? | default {})
          let pdfium_provider = ($pdfium.provider? | default 'unknown' | into string)
          let pdfium_version = ($pdfium.version? | default 'unknown' | into string)
          let pdfium_link_mode = ($pdfium.linkMode? | default 'unknown' | into string)
          let pdfium_sha = ($pdfium.sha256? | default 'unknown' | into string)
          let checks = ($evidence.checks? | default [])
          let check_lines = ($checks | each {|check| $'- `($check)`' })
          let artifact_url = ($env.EVIDENCE_ARTIFACT_URL | str trim)
          let artifact_line = if $artifact_url == '' {
            'Raw verification JSON artifact URL is unavailable.'
          } else {
            ['[Download raw `verification.json`](' $artifact_url ')'] | str join ''
          }
          let summary = ([
            $'## xdoc release verification: `($target)`'
            ''
            $'**Status:** ✅ `($status)` · **Checks:** `($checks | length)` passed'
            ''
            '| Field | Evidence |'
            '| --- | --- |'
            $'| Source | `($source_repository)` · `($source_ref)` |'
            $'| Source SHA | `($source_sha)` |'
            $'| Source version | `($source_version)` |'
            $'| Workflow | `($workflow_repository)` · `($workflow_ref)` |'
            $'| Workflow SHA | `($workflow_sha)` |'
            $'| xdoc version | `($binary_version)` |'
            $'| xdoc revision | `($binary_revision)` |'
            $'| Platform | `($platform_os)/($platform_arch)` |'
            $'| Archive | `($archive_name)` · `($archive_size)` bytes |'
            $'| Archive SHA-256 | `($archive_sha)` |'
            $'| Binary | `($binary_name)` · `($binary_size)` bytes |'
            $'| Binary SHA-256 | `($binary_sha)` |'
            $'| Agent schema | `($agent_schema)` |'
            $'| PPTX inspect | `($inspect_schema)` · `($slide_count)` slides |'
            $'| PDFium | `($pdfium_provider)` `($pdfium_version)` · `($pdfium_link_mode)` |'
            $'| PDFium SHA-256 | `($pdfium_sha)` |'
            ''
            '<details><summary>Executed checks</summary>'
            ''
            ...$check_lines
            ''
            '</details>'
            ''
            $artifact_line
          ] | str join (char nl))

          print 'Release verification evidence:'
          print ($evidence | to json --indent 2)
          print $'Evidence artifact: ($artifact_url)'
          $summary | save --append $env.GITHUB_STEP_SUMMARY
