name: Diagnose Windows paid auth
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workflow
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: 3a669795d9b5bbe48a8d5ede4b3c3398b74e925d
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.XDOC_CLI_EVIDENCE_REPOSITORY }}
          token: ${{ secrets.XDOC_CLI_EVIDENCE_TOKEN }}
          ref: 3ee4e6edee5b59c2b9f73d48967b8b94ce421fe1
          path: evidence
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          github-token: ${{ secrets.ACCESS_TOKEN }}
          run-id: 34426006858
          name: native-facts-windows-x64-1
          path: observation
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'
      - uses: pnpm/setup@v2
        with:
          version: '12.4.0'
      - name: Verify Windows probe regressions
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node --test --test-name-pattern="Windows status|probe configuration" tools/tests/xdoc-cli-paid-probe.test.mjs tools/tests/xdoc-cli-probe-config.test.mjs
      - name: Inspect bounded auth behavior with redacted assertions
        run: node workflow/.github/scripts/windows-paid-diagnostic.mjs source observation evidence
