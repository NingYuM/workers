name: Release Bin

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: 'The tag to release (e.g. v0.1.0)'

jobs:
  build:
    name: Build Bin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PPTX_PDFIUM_LINK_MODE: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: tar.gz
          - os: macos-latest
            target: macos-arm64
            ext: tar.gz
          - os: windows-latest
            target: windows-x64
            ext: zip

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.event.inputs.tag }}
          repository: ${{ secrets.SOURCE_REPO }}

      - name: Checkout Crescent
        uses: actions/checkout@v7
        with:
          ref: feature/patch
          path: refs/crescent
          repository: hustcer/crescent

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '*'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Bin
        shell: nu {0}
        working-directory: source
        run: |
          $env.XDOC_RELEASE_LINK_OPTIMIZE = '1'
          moon update
          moon -C s8fy build cmd/main --release --strip
          print '✅ xdoc build succeeded'

      - name: Prepare artifact
        shell: nu {0}
        working-directory: source
        run: |
          let ext = '${{ matrix.ext }}'
          let target = '${{ matrix.target }}'
          let archive = $'xdoc-($target).($ext)'
          let bin_name = if $nu.os-info.name == 'windows' { 'xdoc.exe' } else { 'xdoc' }
          let pdfium_lib_dir = (pwd | path join 'native' 'pdfium' 'lib')
          mkdir pkg
          cp _build/native/release/build/xdoc/cmd/main/main.exe $'pkg/($bin_name)'
          cp s8fy/LICENSE pkg/LICENSE
          nu tools/relocate-xdoc-pdfium.nu $'pkg/($bin_name)' $pdfium_lib_dir
          nu tools/optimize-xdoc-native.nu $'pkg/($bin_name)'
          nu tools/verify-xdoc-static.nu $'pkg/($bin_name)' test-fixtures/agent-pptx/inspect-smoke.pptx
          if $ext == 'zip' {
            cd pkg; ^7z a $'../($archive)' *
          } else {
            tar -czf $archive -C pkg .
          }
          print $'✅ Archive ready: ($archive)'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-${{ matrix.target }}.${{ matrix.ext }}
          path: source/xdoc-${{ matrix.target }}.${{ matrix.ext }}

  verifier-bundle:
    name: Prepare release verifier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ github.event.inputs.tag }}
          repository: ${{ secrets.SOURCE_REPO }}

      - name: Upload release verifier
        uses: actions/upload-artifact@v7
        with:
          name: release-verifier
          path: |
            source/tools/pdfium-link-checks.nu
            source/tools/verify-xdoc-static.nu
            source/test-fixtures/agent-pptx/inspect-smoke.pptx
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify packaged xdoc artifacts
    needs:
      - build
      - verifier-bundle
    uses: ./.github/workflows/release-artifact-verify.yml

  release:
    name: Create Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: xdoc-*.*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: artifacts/*

      - name: Create GitHub Release for pptx-nova
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SKILL_REPO }}
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: main
          generate_release_notes: true
          files: artifacts/*
