name: Release Bin
env:
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_V8_COVERAGE: ''
  LD_PRELOAD: ''
  LD_LIBRARY_PATH: ''
  DYLD_INSERT_LIBRARIES: ''
  DYLD_LIBRARY_PATH: ''
  DYLD_FRAMEWORK_PATH: ''
  DYLD_FALLBACK_LIBRARY_PATH: ''
  DYLD_FALLBACK_FRAMEWORK_PATH: ''
  GCONV_PATH: ''
  LOCPATH: ''
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: The tag to release (e.g. v0.1.0)
      publish:
        description: Request publication after all checks and environment approval
        type: boolean
        default: false
jobs:
  source-identity:
    name: Validate release source identity
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_version: ${{ steps.identity.outputs.source_version }}
      toolchain: ${{ steps.toolchain.outputs.versions }}
      evidence_sha: ${{ steps.evidence.outputs.evidence_sha }}
      evidence_repository: ${{ steps.evidence.outputs.evidence_repository }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ github.event.inputs.tag }}
      - name: Read controlled toolchain versions
        id: toolchain
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            core.setOutput('versions', JSON.parse(fs.readFileSync('source/tools/xdoc-cli-toolchain.json', 'utf8')));
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=${{ fromJSON(steps.toolchain.outputs.versions).node }}'
      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '>=${{ fromJSON(steps.toolchain.outputs.versions).nushell }}'
      - name: Validate release execution tools
        shell: nu {0}
        working-directory: source
        run: nu --no-config-file tools/xdoc-cli-toolchain.nu --probe
      - name: Resolve and validate source identity
        id: identity
        shell: nu {0}
        working-directory: source
        env:
          RELEASE_IDENTITY_PATH: ${{ runner.temp }}/release-source-identity.json
          RELEASE_SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          (nu tools/resolve-xdoc-release-identity.nu
              --expected-ref $env.RELEASE_SOURCE_REF
              --expected-repository '${{ secrets.SOURCE_REPO }}'
              --report $env.RELEASE_IDENTITY_PATH
              --github-output $env.GITHUB_OUTPUT)
      - name: Require immutable approved evidence checkout
        id: evidence
        shell: nu {0}
        env:
          EVIDENCE_REPOSITORY: ${{ vars.XDOC_CLI_EVIDENCE_REPOSITORY }}
          EVIDENCE_REVISION: ${{ vars.XDOC_CLI_EVIDENCE_REVISION }}
          EVIDENCE_TOKEN_AVAILABLE: ${{ secrets.XDOC_CLI_EVIDENCE_TOKEN != '' }}
        run: |
          mut missing = []
          if not ($env.EVIDENCE_REPOSITORY =~ '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            $missing = ($missing | append 'XDOC_CLI_EVIDENCE_REPOSITORY: repository variable in owner/repo form')
          }
          if not ($env.EVIDENCE_REVISION =~ '^[0-9a-f]{40}$') {
            $missing = ($missing | append 'XDOC_CLI_EVIDENCE_REVISION: repository variable containing the approved full commit SHA')
          }
          if $env.EVIDENCE_TOKEN_AVAILABLE != 'true' {
            $missing = ($missing | append 'XDOC_CLI_EVIDENCE_TOKEN: repository secret with read-only access to evidence')
          }
          if not ($missing | is-empty) {
            error make {msg: 'Release repository configuration is incomplete', help: ($missing | str join (char nl))}
          }
          [$'evidence_sha=($env.EVIDENCE_REVISION)' $'evidence_repository=($env.EVIDENCE_REPOSITORY)' ''] | str join (char nl) | save --append $env.GITHUB_OUTPUT
      - name: Checkout approved release evidence
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.evidence.outputs.evidence_repository }}
          ref: ${{ steps.evidence.outputs.evidence_sha }}
          token: ${{ secrets.XDOC_CLI_EVIDENCE_TOKEN }}
          path: release-evidence
          persist-credentials: false
      - name: Preflight all approved release inputs
        shell: nu {0}
        working-directory: source
        env:
          RELEASE_EVIDENCE: ${{ github.workspace }}/release-evidence/release.json
          RELEASE_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          RELEASE_SOURCE_VERSION: ${{ steps.identity.outputs.source_version }}
          RELEASE_PREFLIGHT_REPORT: ${{ runner.temp }}/release-input-preflight.json
        run: |
          let result = (nu --no-config-file tools/prepare-xdoc-cli-release.nu check --release-input $env.RELEASE_EVIDENCE --source-revision $env.RELEASE_SOURCE_SHA --source-version $env.RELEASE_SOURCE_VERSION --report $env.RELEASE_PREFLIGHT_REPORT --json | complete)
          if ($env.RELEASE_PREFLIGHT_REPORT | path exists) {
            let report = (open $env.RELEASE_PREFLIGHT_REPORT)
            [
              '## CLI release input preflight'
              $'Status: ($report.status). Candidate execution: not performed.'
              ''
              ...($report.findings | each {|finding| $'- ($finding.field): ($finding.message)' })
              ''
            ] | str join (char nl) | save --append $env.GITHUB_STEP_SUMMARY
          }
          if $result.exit_code != 0 {
            error make {msg: 'Release inputs are incomplete or invalid; see the job summary', help: $result.stderr}
          }
      - name: Upload release source identity
        uses: actions/upload-artifact@v7
        with:
          name: release-source-identity
          path: ${{ runner.temp }}/release-source-identity.json
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build xdoc (${{ matrix.os }})
    needs: source-identity
    runs-on: ${{ matrix.os }}
    env:
      XDOC_PDFIUM_LINK_MODE: static
      XDOC_CLI_REVISION: ${{ needs.source-identity.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: tar.gz
          - os: macos-15
            target: macos-arm64
            ext: tar.gz
          - os: windows-latest
            target: windows-x64
            ext: zip
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source-identity.outputs.source_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).node }}'
      - name: Checkout controlled Crescent source
        uses: actions/checkout@v7
        with:
          path: refs/crescent
          repository: >-
            ${{
            fromJSON(needs.source-identity.outputs.toolchain).nativeSources.crescent.repository }}
          ref: >-
            ${{
            fromJSON(needs.source-identity.outputs.toolchain).nativeSources.crescent.revision }}
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).pnpm }}'
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ fromJSON(needs.source-identity.outputs.toolchain).moonbit.distribution }}
          core-version: ${{ fromJSON(needs.source-identity.outputs.toolchain).moonbit.core }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).nushell }}'
      - name: Validate release toolchain requirements
        shell: nu {0}
        working-directory: source
        run: |
          nu --no-config-file tools/xdoc-cli-toolchain.nu
          pnpm install --frozen-lockfile
      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: nu {0}
        run: "'MACOSX_DEPLOYMENT_TARGET=13.0' | save --append $env.GITHUB_ENV"
      - name: Checkout approved release evidence
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.source-identity.outputs.evidence_repository }}
          ref: ${{ needs.source-identity.outputs.evidence_sha }}
          token: ${{ secrets.XDOC_CLI_EVIDENCE_TOKEN }}
          path: release-evidence
          persist-credentials: false
      - name: Build and gate public xdoc CLI
        shell: nu {0}
        working-directory: source
        env:
          RELEASE_EVIDENCE: ${{ github.workspace }}/release-evidence/release.json
          XDOC_RELEASE_SOURCE_SHA: ${{ needs.source-identity.outputs.source_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
          CANDIDATE_OUTPUT: ${{ runner.temp }}/xdoc-candidate
        run: |
          moon update
          nu --no-config-file tools/xdoc-cli-release-target.nu --release-input $env.RELEASE_EVIDENCE --source-revision $env.XDOC_RELEASE_SOURCE_SHA --target $env.RELEASE_TARGET --output-dir $env.CANDIDATE_OUTPUT --require-paid
      - name: Upload unarchived candidate and minimal reports
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-candidate-${{ matrix.target }}
          path: |-
            ${{ runner.temp }}/xdoc-candidate/package/
            ${{ runner.temp }}/xdoc-candidate/gate.json
            ${{ runner.temp }}/xdoc-candidate/paid.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  verifier-bundle:
    name: Prepare release verifier
    needs: source-identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source-identity.outputs.source_sha }}
      - name: Download release source identity
        uses: actions/download-artifact@v8
        with:
          name: release-source-identity
          path: source
      - name: Upload release verifier
        uses: actions/upload-artifact@v7
        with:
          name: release-verifier
          path: |
            source/tools/pdfium-link-checks.nu
            source/tools/verify-macos-deployment-target.nu
            source/tools/verify-xdoc-static.nu
            source/tools/xdoc-cli-toolchain.nu
            source/tools/xdoc-cli-toolchain.json
            source/test-fixtures/agent-pptx/inspect-smoke.pptx
            source/release-source-identity.json
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Verify packaged xdoc artifacts
    needs:
      - aggregate
      - verifier-bundle
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-artifact-verify.yml
  release:
    name: Create Release
    needs:
      - verify
      - source-identity
    runs-on: ubuntu-latest
    if: inputs.publish
    environment: xdoc-cli-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require publication approval
        uses: actions/github-script@v8
        with:
          script: |
            const environment = await github.rest.repos.getEnvironment({
              ...context.repo, environment_name: 'xdoc-cli-release',
            });
            if (!environment.data.protection_rules?.some(rule => rule.type === 'required_reviewers' && rule.reviewers?.length > 0)) {
              core.setFailed('Configure required reviewers on the xdoc-cli-release environment before publishing.');
            }
      - name: Require unchanged source tag
        uses: actions/github-script@v8
        env:
          RELEASE_SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPO }}
          RELEASE_SOURCE_SHA: ${{ needs.source-identity.outputs.source_sha }}
          RELEASE_SOURCE_VERSION: ${{ needs.source-identity.outputs.source_version }}
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            const [owner, repo] = process.env.RELEASE_SOURCE_REPOSITORY.split('/');
            let { data: { object } } = await github.rest.git.getRef({ owner, repo, ref: `tags/v${process.env.RELEASE_SOURCE_VERSION}` });
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              ({ data: { object } } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha }));
            }
            if (object.type !== 'commit' || object.sha !== process.env.RELEASE_SOURCE_SHA) {
              core.setFailed('The source tag no longer matches the verified release candidate.');
            }
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: xdoc-*.*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          tag_name: v${{ needs.source-identity.outputs.source_version }}
          target_commitish: ${{ needs.source-identity.outputs.source_sha }}
          generate_release_notes: true
          files: artifacts/*
      - name: Create GitHub Release for pptx-nova
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SKILL_REPO }}
          tag_name: v${{ needs.source-identity.outputs.source_version }}
          target_commitish: main
          generate_release_notes: true
          files: artifacts/*
  aggregate:
    name: Aggregate all four approved candidates before archiving
    needs:
      - source-identity
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source-identity.outputs.source_sha }}
      - name: Checkout approved release evidence
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.source-identity.outputs.evidence_repository }}
          ref: ${{ needs.source-identity.outputs.evidence_sha }}
          token: ${{ secrets.XDOC_CLI_EVIDENCE_TOKEN }}
          path: release-evidence
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).node }}'
      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).nushell }}'
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: '>=${{ fromJSON(needs.source-identity.outputs.toolchain).pnpm }}'
      - name: Install verifier dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Download current raw candidates
        uses: actions/download-artifact@v8
        with:
          pattern: xdoc-candidate-*
          path: ${{ runner.temp }}/release-candidates
      - name: Require four-target Paid aggregation
        shell: nu {0}
        working-directory: source
        env:
          RELEASE_EVIDENCE: ${{ github.workspace }}/release-evidence/release.json
          RELEASE_SOURCE: ${{ needs.source-identity.outputs.source_sha }}
          CANDIDATE_ROOT: ${{ runner.temp }}/release-candidates
          RELEASE_STAGE: ${{ runner.temp }}/verified-release
          RELEASE_REPORT: ${{ runner.temp }}/xdoc-cli-release-aggregate.json
          RELEASE_FIXTURES: ${{ runner.temp }}/aggregate-fixtures
        run: |
          mkdir $env.RELEASE_FIXTURES
          pnpm xdoc-cli:probe-fixtures --output-dir $env.RELEASE_FIXTURES --json
          node tools/xdoc-cli-release.mjs --action aggregate --release-input $env.RELEASE_EVIDENCE --source-revision $env.RELEASE_SOURCE --candidate-root $env.CANDIDATE_ROOT --fixtures $env.RELEASE_FIXTURES --default-license (pwd | path join s8fy LICENSE) --stage-dir $env.RELEASE_STAGE --report $env.RELEASE_REPORT --require-paid
      - name: Archive the verified frozen packages
        shell: nu {0}
        working-directory: source
        env:
          RELEASE_STAGE: ${{ runner.temp }}/verified-release
        run: |
          mkdir release-archives
          for target in [linux-x64 linux-arm64 macos-arm64 windows-x64] {
            let package = ($env.RELEASE_STAGE | path join $target package | path expand --strict)
            let extension = if $target == windows-x64 { 'zip' } else { 'tar.gz' }
            let archive = (pwd | path join release-archives $'xdoc-($target).($extension)')
            if $target == windows-x64 {
              cd $package
              ^7z a $archive *
            } else { ^tar -czf $archive -C $package . }
            if $env.LAST_EXIT_CODE != 0 { error make {msg: 'Verified package archive failed'} }
          }
      - name: Upload linux-x64 archive
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-linux-x64.tar.gz
          path: source/release-archives/xdoc-linux-x64.tar.gz
          if-no-files-found: error
      - name: Upload linux-arm64 archive
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-linux-arm64.tar.gz
          path: source/release-archives/xdoc-linux-arm64.tar.gz
          if-no-files-found: error
      - name: Upload macos-arm64 archive
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-macos-arm64.tar.gz
          path: source/release-archives/xdoc-macos-arm64.tar.gz
          if-no-files-found: error
      - name: Upload windows-x64 archive
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-windows-x64.zip
          path: source/release-archives/xdoc-windows-x64.zip
          if-no-files-found: error
      - name: Archive minimal release aggregation evidence
        uses: actions/upload-artifact@v7
        with:
          name: xdoc-cli-release-evidence
          path: |-
            ${{ runner.temp }}/xdoc-cli-release-aggregate.json
            ${{ runner.temp }}/verified-release/*/gate.json
            ${{ runner.temp }}/verified-release/*/free.json
            ${{ runner.temp }}/verified-release/*/paid.json
          if-no-files-found: error
          retention-days: 90
