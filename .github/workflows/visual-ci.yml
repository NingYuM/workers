name: Visual CI
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
        default: main
        description: Source branch, tag or commit to validate
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: main
    secrets:
      SOURCE_REPO:
        required: true
      ACCESS_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: visual-ci-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  dom:
    name: DOM and transition checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: nu --no-config-file {0}
        working-directory: source
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 12.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: hustcer/setup-nu@v3
        with:
          version: 0.115.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build JavaScript dependencies and check renderer types
        run: |
          pnpm --filter @s8fy/emf2svg build
          pnpm --filter @s8fy/pptx-parser build
          pnpm --filter @s8fy/pptx-renderer exec tsc --noEmit
      - name: Transition and Morph regressions
        run: pnpm --filter @s8fy/pptx-renderer test:transitions
      - name: Check composition source and test formatting
        run: |
          let files = [
            packages/pptx-renderer/src/transitions/basic.ts
            packages/pptx-renderer/src/morph/dom.ts
            packages/pptx-renderer/tests/basicComposition.test.ts
            packages/pptx-renderer/package.json
            scripts/basic-transition-composition.mjs
            .github/workflows/visual-ci.yml
          ]
          pnpm exec oxfmt --check ...$files
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Two-page composition and interruption pixels
        run: |
          pnpm smoke:transition-composition ($env.RUNNER_TEMP | path join 'basic-composition')
      - name: Retain frames and pixel report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: basic-transition-composition
          path: ${{ runner.temp }}/basic-composition
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: Browser rendering and visual baselines
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: nu --no-config-file {0}
        working-directory: source
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Checkout Crescent
        uses: actions/checkout@v7
        with:
          path: refs/crescent
          repository: hustcer/crescent
          ref: feature/patch
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 12.6.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: hustcer/setup-nu@v3
        with:
          version: 0.115.1
      - name: Install dependencies
        run: |
          moon update
          pnpm install --frozen-lockfile
      - name: Build browser WASM dependencies
        run: |
          moon -C parser-mbt build cmd/main --target wasm-gc --release --strip
          cp _build/wasm-gc/release/build/pptx_parser/cmd/main/main.wasm packages/pptx-parser/src/mbt/main.wasm
          node tools/build-license-policy-wasm.mjs --src
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Visual regression gate
        id: visual
        run: pnpm release:visual
      - name: Slide transition composition and CSS equivalence
        if: ${{ !cancelled() && (success() || steps.visual.outcome == 'failure') }}
        run: pnpm smoke:transitions ($env.RUNNER_TEMP | path join 'transition-smoke')
      - name: Upload browser frames, traces and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-visual-macos
          path: |
            source/docs/sdk-baselines/playwright-results
            ${{ runner.temp }}/transition-smoke
          if-no-files-found: ignore
          retention-days: 15
run-name: Visual CI (${{ inputs.ref }})
